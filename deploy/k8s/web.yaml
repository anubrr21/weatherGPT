apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-web
  labels:
    app.kubernetes.io/name: weathergpt-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weathergpt-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weathergpt-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: weathergpt-web:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: API_UPSTREAM
              value: weathergpt-api:8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-web
spec:
  selector:
    app.kubernetes.io/name: weathergpt-web
  ports:
    - name: http
      port: 80
      targetPort: http
