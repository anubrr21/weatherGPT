apiVersion: apps/v1
kind: Deployment
metadata:
  name: weathergpt-worker
  labels:
    app.kubernetes.io/name: weathergpt-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weathergpt-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weathergpt-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: weathergpt-api:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ROLE
              value: worker
          envFrom:
            - configMapRef:
                name: weathergpt-config
            - secretRef:
                name: weathergpt-secrets
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
