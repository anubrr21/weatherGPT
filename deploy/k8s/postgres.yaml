apiVersion: v1
kind: Service
metadata:
  name: weathergpt-db
  labels:
    app.kubernetes.io/name: weathergpt-db
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: weathergpt-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weathergpt-db
spec:
  serviceName: weathergpt-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weathergpt-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weathergpt-db
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: weathergpt
            - name: POSTGRES_USER
              value: weathergpt
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: weathergpt-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "weathergpt", "-d", "weathergpt"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "weathergpt", "-d", "weathergpt"]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
