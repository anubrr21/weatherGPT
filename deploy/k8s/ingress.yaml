apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weathergpt
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - weathergpt.example.in
      secretName: weathergpt-tls
  rules:
    - host: weathergpt.example.in
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: weathergpt-api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: weathergpt-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weathergpt-web
                port:
                  name: http
