apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weathergpt
labels:
  - pairs:
      app.kubernetes.io/part-of: weathergpt
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: weathergpt-api
    newName: ghcr.io/anubrr21/weathergpt-api
    newTag: latest
  - name: weathergpt-web
    newName: ghcr.io/anubrr21/weathergpt-web
    newTag: latest
