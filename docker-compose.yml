name: weathergpt

x-backend: &backend
  build:
    context: ./backend
    args:
      VOICES: ${VOICES:-full}
  image: weathergpt-api:${TAG:-local}
  env_file: ./backend/.env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: weathergpt
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env next to docker-compose.yml}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathergpt -d weathergpt"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    environment:
      ROLE: worker
      DATABASE_URL: postgresql+asyncpg://weathergpt:${POSTGRES_PASSWORD}@db:5432/weathergpt

  api:
    <<: *backend
    environment:
      ROLE: api
      DATABASE_URL: postgresql+asyncpg://weathergpt:${POSTGRES_PASSWORD}@db:5432/weathergpt
    deploy:
      replicas: ${API_REPLICAS:-2}

  web:
    build: ./frontend
    image: weathergpt-web:${TAG:-local}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
